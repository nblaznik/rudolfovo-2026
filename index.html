<script>
(function () {
  // The page content is encrypted (AES-GCM, key from the password with PBKDF2-SHA256); it is decrypted here in the browser.
  var B = JSON.parse(document.getElementById('blob').textContent);
  var u8 = function (s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
  var KEY = 'talk-key-' + B.s;
  function show(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(B.i) }, key, u8(B.c)).then(function (buf) {
      var html = new TextDecoder().decode(buf);
      var swap = function () { document.open(); document.write(html); document.close(); };
      // replace the page only once this shell has finished loading (writing earlier would append instead of replace)
      if (document.readyState === 'complete') swap(); else window.addEventListener('load', function () { setTimeout(swap, 0); });
    });
  }
  function fromPassword(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(B.s), iterations: B.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });

  try {
    var saved = sessionStorage.getItem(KEY);

      crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', true, ['decrypt']).then(show).catch(function () {
        sessionStorage.removeItem(KEY); document.documentElement.style.visibility = '';
      });
    }
  } catch (e) {}
  var f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', function (e) {

    var k;
    fromPassword(pw.value).then(function (key) { k = key; return show(key); }).then(function () {
      crypto.subtle.exportKey('raw', k).then(function (raw) {
